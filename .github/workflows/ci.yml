name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  engine:
    name: Engine (lint, types, tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: engine
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - run: uv sync --frozen
      - run: uv run ruff check src tests
      - run: uv run ruff format --check src tests
      - run: uv run mypy src
      # Tests that need the pinned RocketPy source or a Space-Track login skip themselves.
      - run: uv run pytest -q

  web:
    name: Console (types, lint, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      # No keys in CI: the globe falls back to Esri imagery without a Cesium ion token.
      - run: npm run build

  images:
    name: Production images (build only)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Compose file is valid
        run: docker compose config --quiet
      - name: API image
        run: docker build -f engine/Dockerfile -t asteria-api:ci .
      - name: API image starts; without artifacts it is alive but not ready
        run: |
          docker run -d --name api -p 8000:8000 asteria-api:ci
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:8000/health && break; sleep 1; done
          curl -fsS http://127.0.0.1:8000/health
          code=$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8000/ready)
          test "$code" = "503" || { echo "::error::/ready gave $code without artifacts"; exit 1; }
          docker logs api
          docker rm -f api
      - name: Console image
        run: docker build -f web/Dockerfile -t asteria-web:ci .
      - name: No secrets or caches in the images
        run: |
          for img in asteria-api:ci asteria-web:ci; do
            if docker run --rm --entrypoint sh "$img" -c 'find / -xdev \( -name ".env" -o -name ".env.local" -o -path "*/.asteria/*" \) 2>/dev/null | grep -q .'; then
              echo "::error::$img contains a settings file or local cache"; exit 1
            fi
          done
