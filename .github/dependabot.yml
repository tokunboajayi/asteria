version: 2
updates:
  - package-ecosystem: uv
    directory: /engine
    schedule: { interval: weekly }
    open-pull-requests-limit: 5
  - package-ecosystem: npm
    directory: /web
    schedule: { interval: weekly }
    open-pull-requests-limit: 5
    ignore:
      # TypeScript 7 (native compiler) is not yet supported by the lint tooling.
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
      # Node type definitions must match the Node runtime (22), not the newest Node.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
    # Packages that must move in lockstep, or `npm ci` fails on peer ranges.
    groups:
      react:
        patterns: ["react", "react-dom", "@types/react", "@types/react-dom"]
      next:
        patterns: ["next", "eslint-config-next", "@next/*"]
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: monthly }
