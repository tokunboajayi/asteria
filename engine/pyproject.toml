[project]
name = "asteria-engine"
version = "0.1.0"
description = "Asteria engine: physics ghost vs. recorded reality, measured and explained."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11,<3.14"
dependencies = [
    # Physics. Pinned to the release whose example notebooks and data Asteria executes.
    "rocketpy==1.13.0",
    "netCDF4>=1.6.4",
    "numpy>=1.26",
    "scipy>=1.11",
    "matplotlib>=3.9",
    # Orbits: the reference SGP4 propagator (Vallado), as used with US Space Force element sets.
    "sgp4>=2.23",
    # Data contract and read-only API.
    "pydantic>=2.6",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
]

[project.scripts]
asteria = "asteria.cli:main"

[dependency-groups]
dev = ["pytest>=8", "httpx>=0.27", "ruff>=0.6", "mypy>=1.10"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/asteria"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
# Typographic minus, multiplication sign and en dash are deliberate: displayed numbers use
# them, and the debrief validator matches displayed text character for character.
allowed-confusables = ["−", "×", "–"]

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true
mypy_path = "src"

[tool.pytest.ini_options]
testpaths = ["tests"]
